[project]
name = "promotion-agent"
version = "3.0.0"
description = "Automate posting and promoting AI projects to social media platforms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "kevinten10"},
]
keywords = ["ai", "social-media", "promotion", "automation", "openclaw"]

dependencies = [
    "httpx>=0.25.0",
    "praw>=7.7.0",
    "tweepy>=4.14.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "ruff>=0.1.6",
]

[project.scripts]
promote = "promotion_agent.cli.app:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--verbose", "--tb=short"]
